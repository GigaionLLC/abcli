# Release — cross-compiled, signed abctl binaries on a v* tag.
# Build the config locally first: `goreleaser check` && `goreleaser release --snapshot --clean`.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # cosign keyless signing (Sigstore OIDC)
  attestations: write # build-provenance attestations

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # --- abgui — the desktop app, one job per platform --------------------------------------
  #
  # GoReleaser cannot build these: Flutter does not cross-compile desktop, so each target needs a
  # runner of its own. They attach to the SAME GitHub Release the goreleaser job created.
  #
  # macOS signs and uploads BEFORE notarizing, so an Apple notary outage can never leave a release
  # with no installable asset. .github/workflows/gui-flutter.yml builds all three platforms on every
  # PR, so a packaging break surfaces there rather than here.

  gui-flutter-macos:
    name: abgui (Flutter) macOS installer
    needs: goreleaser # the GitHub Release must exist before we upload to it
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_APPLE_SIGNING_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history → a matching git-describe version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # to compile the embedded abctl
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0 # keep in step with .github/workflows/gui-flutter.yml
          cache: true
      - name: pin the artifact version for this job
        shell: bash
        # `git describe --dirty` is NOT stable across two calls in one job: `flutter build`
        # rewrites tracked files, so the tree is clean on the first and dirty on the second.
        # Computing it once here is what makes the notarize step able to find what the build step
        # produced. (v0.4.28 shipped without notarized macOS assets for exactly this reason.)
        run: echo "ABGUI_VERSION=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_ENV"

      - name: import Developer ID certificate
        if: ${{ env.HAS_APPLE_SIGNING_CERT == 'true' }}
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || github.run_id }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "APPLE_CODESIGN_IDENTITY=${APPLE_CODESIGN_IDENTITY:-Developer ID Application}" >> "$GITHUB_ENV"

      - name: build + sign abgui (DMG + zip, universal abctl embedded)
        env:
          APPLE_NOTARIZE: "0" # notarized separately below so signed assets land first
        run: ./scripts/build-gui-flutter.sh macos

      # Upload the signed-but-UNNOTARIZED assets before anyone waits on Apple: they install behind
      # one Gatekeeper prompt, whereas a release that died waiting on the notary ships nothing.
      #
      # They go up under their OWN name, `-macos-unnotarized`, and are never overwritten. An
      # earlier version of this uploaded them under the plain name and clobbered it after
      # stapling — which meant that for the few minutes Apple was working, the release page served
      # an unnotarized build under the name that later meant "notarized", with nothing to tell the
      # two apart. A filename must always disclose the trust state of what is inside it.
      - name: upload the signed but unnotarized assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            bin/abgui-*-macos-unnotarized.dmg \
            bin/abgui-*-macos-unnotarized.zip \
            --clobber

      - name: notarize + staple
        id: notarize
        continue-on-error: true # signed assets already shipped; a notary outage must not fail the release
        if: ${{ env.HAS_APPLE_SIGNING_CERT == 'true' && env.HAS_APPLE_NOTARY_CREDS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_TIMEOUT: "20m"
        run: ./scripts/build-gui-flutter.sh macos-notarize

      # The notarized artifacts take the PLAIN name; the -unnotarized ones stay exactly as they
      # were. Nothing is overwritten and nothing is renamed on the release, so a file's name always
      # tells you what it is — and the presence of the plain name is itself the signal that
      # notarization succeeded. If Apple's notary fails, the release carries only -unnotarized
      # assets, which is the honest outcome rather than a silent downgrade.
      - name: upload the notarized, stapled assets
        if: ${{ steps.notarize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            bin/abgui-*-macos.dmg \
            bin/abgui-*-macos.zip \
            --clobber

  gui-flutter-windows:
    name: abgui (Flutter) Windows
    needs: goreleaser
    runs-on: windows-latest
    env:
      # Azure Trusted Signing — PRE-WIRED and dark until the credentials exist. Same shape as
      # HAS_APPLE_SIGNING_CERT in the macOS job above: the PRESENCE of the credential is the
      # switch, so the first tag after a certificate is provisioned signs itself with no
      # workflow edit. A missing secret evaluates to '' and the gated steps skip entirely —
      # they never read a secret they were not given.
      #
      # The names are Airclone's on purpose, not invented here. Gigaion runs ONE Azure
      # Artifact/Trusted Signing account and ONE Entra app for the whole org, with the secrets
      # set at org level and visibility = selected repositories; wiring abcli up is adding this
      # repo to each existing secret's list, not creating a second signing identity. Inventing
      # ABCLI_-prefixed twins would quietly fork that. See docs/windows-store-and-signing.md.
      #
      # AZURE_SIGNING_PROFILE is in the condition because it is the one value with no default:
      # the three secrets authenticate, but signing needs to be told WHICH certificate profile,
      # and an empty profile name fails inside the action with an Azure error rather than a
      # legible "not configured yet".
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_PROFILE != '' }}
      # Drives the artifact NAMES: every packaging step in build-gui-flutter.sh appends
      # "-unsigned" unless this is 1, so an unsigned build can never be published under a name
      # that implies it was signed. Derived from the same condition that gates the signing steps
      # themselves, so the label and the reality cannot drift apart.
      ABGUI_SIGNED: ${{ (secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_PROFILE != '') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: pin the artifact version for this job
        shell: bash
        # `git describe --dirty` is NOT stable across two calls in one job: `flutter build`
        # rewrites tracked files, so the tree is clean on the first and dirty on the second.
        # Computing it once here is what makes the notarize step able to find what the build step
        # produced. (v0.4.28 shipped without notarized macOS assets for exactly this reason.)
        run: echo "ABGUI_VERSION=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_ENV"

      - name: build + package abgui (Windows x64)
        shell: bash
        run: ./scripts/build-gui-flutter.sh windows

      # HARD GATE: the build must be self-contained with respect to the MSVC runtime.
      # abgui-flutter/windows/CMakeLists.txt copies it app-local via
      # InstallRequiredSystemLibraries, but a missing or renamed VS redist directory only makes
      # CMake *warn* — so verify the ARTIFACT, never the green check. Without these DLLs beside
      # abgui.exe the app cannot start on a machine that has no Visual C++ Redistributable
      # (which no dev box ever is), and a Store package is rejected under policy 10.2.4.1 for an
      # undisclosed dependency on non-integrated software.
      - name: verify the MSVC runtime is bundled (self-contained build)
        shell: bash
        run: |
          set -euo pipefail
          rel="abgui-flutter/build/windows/x64/runner/Release"
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            if [ ! -f "$rel/$dll" ]; then
              echo "::error::$dll is not next to abgui.exe in $rel — this build would require the Visual C++ Redistributable and would not launch on a clean machine."
              exit 1
            fi
          done
          ls -l "$rel"/*140*.dll

      # Sign the payload BEFORE it is wrapped, so the installer and the Store package both
      # carry signed binaries. Both .exe in the Release dir are signed: abgui.exe and the
      # EMBEDDED abctl.exe — signing only the app would leave the thing it spawns unsigned,
      # which is what SmartScreen and any application-control policy actually look at.
      #
      # KNOWN GAP, deliberately left: `windows` builds the portable zip in the same step as
      # the Flutter build, so the ZIP is packed before this runs and its binaries are
      # unsigned even when signing is on. The installer and the MSIX are unaffected. Closing
      # it means splitting the zip out of `build-gui-flutter.sh windows` into its own
      # "package what exists" subcommand and re-packing here — do that when the certificate
      # is actually provisioned, and re-check the zip's signatures before believing it.
      #
      # `uses:` steps ignore any working-directory, so paths are workspace-relative.
      - name: sign abgui.exe + embedded abctl.exe (Azure Trusted Signing)
        if: ${{ env.HAS_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: abgui-flutter/build/windows/x64/runner/Release
          files-folder-filter: exe
          files-folder-recurse: false

      # Repack the portable zip AFTER signing — nothing is rebuilt, it just re-zips the Release
      # directory whose .exe files the step above signed in place.
      #
      # Without this the zip is the one Windows artifact that ships UNSIGNED binaries out of a
      # release that has a certificate, because `windows` packs it in the same breath as the
      # build. The installer and the MSIX were always fine: both are produced after signing. This
      # is the worst shape for such a bug — the release looks signed, and only the download most
      # likely to be scanned by an endpoint tool isn't.
      - name: repack the portable zip from the signed binaries
        shell: bash
        run: ./scripts/build-gui-flutter.sh windows-zip

      # Inno Setup → bin/abgui-setup-x64.exe. The compiler ships on the windows-latest image;
      # the script also probes the per-user winget location and says so plainly if it finds
      # neither, because "ISCC is not on PATH" is otherwise reported as a bash 127.
      - name: build installer (Inno Setup)
        shell: bash
        run: ./scripts/build-gui-flutter.sh windows-installer

      # Sign the installer itself. Without this the download is the one file every user
      # double-clicks, unsigned — the app inside being signed does not help SmartScreen.
      # bin/ also holds the standalone abctl.exe the packaging step built; this job does not
      # upload it (goreleaser ships abctl), so signing it too is harmless.
      - name: sign installer (Azure Trusted Signing)
        if: ${{ env.HAS_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: bin
          files-folder-filter: exe
          files-folder-recurse: false

      # Upload the zip + installer BEFORE the Store package. Same principle the macOS job
      # uses for notarization: the assets a human can actually install must land first, so an
      # optional lane failing never leaves the release page with nothing on it.
      #
      # Still unsigned until the AZURE_* credentials exist — Windows has no free equivalent of
      # Apple notarization, so SmartScreen warns on first download until then.
      - name: upload abgui Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" bin/abgui-*-windows-x64*.zip bin/abgui-setup-x64*.exe --clobber

      # Microsoft Store package. `--store` means UNSIGNED and Partner-Center-ready (Microsoft
      # signs it on ingestion), so this needs no certificate and never prompts.
      #
      # Identity comes from repo VARIABLES, not pubspec: Package/Identity/Publisher is a
      # Partner-Center-assigned GUID and this repo is public, so pubspec keeps inert
      # placeholders and these three override them —
      #   MSIX_IDENTITY_NAME -> Package/Identity/Name          (the reserved package name)
      #   MSIX_PUBLISHER     -> Package/Identity/Publisher      (CN=<GUID>)
      #   MSIX_DISPLAY_NAME  -> Package/Properties/DisplayName  (a RESERVED app name, and also
      #                         the Start-menu tile — msix drives both from one value)
      # All must match Partner Center → Product management → Product identity EXACTLY or the
      # upload is rejected before certification even starts. Unset variables are not fatal:
      # the script emits a ::warning:: and builds a package that is good for testing the
      # payload and nothing else.
      #
      # continue-on-error: the Store lane is optional and must never fail a release. The
      # script REFUSES to package a bundle with no abctl.exe, so the outcome of a broken
      # embed is "no .msix this tag", not a Store submission for an app that cannot run a
      # single command.
      - name: build MSIX (Microsoft Store package)
        id: msix
        continue-on-error: true
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: ./scripts/build-gui-flutter.sh windows-msix

      - name: upload abgui MSIX asset
        if: ${{ steps.msix.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" bin/abgui-*-windows-x64-store.msix --clobber

  gui-flutter-linux:
    name: abgui (Flutter) Linux
    needs: goreleaser
    # PINNED to 22.04, not ubuntu-latest — a Flutter Linux binary's glibc floor is the
    # BUILDER's. Built on 24.04 it refuses to start on Debian 12 / Ubuntu 22.04 with
    # "GLIBC_2.38 not found", and there is no Flutter flag that changes this.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: pin the artifact version for this job
        shell: bash
        # `git describe --dirty` is NOT stable across two calls in one job: `flutter build`
        # rewrites tracked files, so the tree is clean on the first and dirty on the second.
        # Computing it once here is what makes the notarize step able to find what the build step
        # produced. (v0.4.28 shipped without notarized macOS assets for exactly this reason.)
        run: echo "ABGUI_VERSION=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_ENV"

      - name: install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: build + package abgui (Linux x64)
        run: ./scripts/build-gui-flutter.sh linux
      - name: upload abgui Linux asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" bin/abgui-*-x86_64*.AppImage --clobber
