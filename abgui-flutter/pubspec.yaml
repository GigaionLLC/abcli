name: abgui
description: "Apple Business Manager GitOps, with a GUI. A desktop front-end for the abctl CLI."
publish_to: 'none'

# The version is NOT the source of truth — releases are cut from a `v*` git tag and the
# real version is injected at build time (see scripts/build-gui-flutter.sh, which passes
# --build-name/--build-number from `git describe`). This line only keeps `flutter run`
# and a bare `flutter build` from failing, and should track the last shipped tag.
version: 0.4.27+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State. One provider per pane rather than one app-wide `isLoading`, because the Swift
  # app's single shared flag is exactly what made every screen blank whenever any one of
  # them was refreshing. See docs/abgui-flutter-port.md §"what we are NOT porting".
  flutter_riverpod: ^2.6.1

  # Where the app keeps its own files: the run-log directory and the PEM written for a
  # pasted private key (the Swift CredentialStore's Application Support tree).
  path_provider: ^2.1.4

  # Remembered settings: the chosen GitOps workspace path, the active context, window
  # geometry. The Swift app used @AppStorage/UserDefaults for the same job.
  shared_preferences: ^2.3.0

  # Native folder picker for choosing the GitOps workspace, and the save dialog behind
  # CSV export.
  file_selector: ^1.0.0

  # Opening documentation links from the About/Settings surface.
  url_launcher: ^6.3.0

  # The app's own version for the run-log header and the About panel.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Packages the Windows build as an .msix for the Microsoft Store — see the msix_config
  # block at the bottom of this file, `build-gui-flutter.sh windows-msix`, and the
  # gui-flutter-windows job in .github/workflows/release.yml. DEV-ONLY: it is a command-line
  # packager, nothing from it is compiled into or shipped inside the app, and it is never
  # imported from lib/. Listing it under `dependencies` would put a build tool in the runtime
  # dependency graph for no reason.
  msix: ^3.18.0

  # Generates the macOS .icns set and the Windows .ico from ONE master PNG. DEV-ONLY.
  # Without it both platforms keep the stock `flutter create` Flutter logo — which is
  # exactly what shipped through v0.4.30: the AppImage and the MSIX tiles had the real
  # mark (both take a plain PNG), while the macOS .app and the Windows .exe did not,
  # because those need generated multi-size icon containers nobody had produced.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# --- Microsoft Store packaging (the `msix` dev dependency) --------------------------------
#
# Build with `../scripts/build-gui-flutter.sh windows-msix`, which packages what
# `windows` ALREADY built (`--build-windows false`) rather than rebuilding — the same
# "operate on existing output" split as `macos` / `macos-notarize`, and the reason the
# MSIX is guaranteed to contain the exact bytes that were zipped and installer-ed.
#
# CI passes `--store`, which produces an UNSIGNED, Partner-Center-uploadable package
# (Microsoft signs it on ingestion). A local `dart run msix:create` without `--store`
# test-signs it instead, which installs for testing and is NOT submittable.
#
# == IDENTITY: the three values below marked PLACEHOLDER are inert on purpose ==
#
# Store identity is validated on UPLOAD, before certification even starts, and a mismatch
# is a hard "Package acceptance validation error" — with the first failure MASKING the
# rest, so they must be fixed as a set. None of it comes from a signing certificate.
# `Package/Identity/Publisher` is a Partner-Center-assigned GUID and **this repo is
# public**, so release.yml injects the real values from the repo variables
# MSIX_IDENTITY_NAME / MSIX_PUBLISHER / MSIX_DISPLAY_NAME. Keeping obvious placeholders
# here means a local build still runs end-to-end; it does not mean the local package can
# be submitted. See docs/windows-store-and-signing.md.
#
# `publisher_display_name` is the ONE real value: it is the company name, already public
# throughout this repo (LICENSE, NOTICE, the installer's AppPublisher, the macOS signing
# subject), it is not a GUID, and it must match the Store account's publisher display name
# byte-for-byte — "GigaionLLC" is a different string and is rejected.
#
# Gotcha: msix drives BOTH `Package/Properties/DisplayName` and the Start-menu tile
# (`uap:VisualElements/@DisplayName`) from one `display_name`, so MSIX_DISPLAY_NAME has to
# be a RESERVED app name AND is what users read on the tile. Reserving a short name is the
# only way to get a short tile.
#
# ==========================================================================================
# ==  AN MSIX MUST NOT DOWNLOAD EXECUTABLE CODE AT RUNTIME (Store policy 10.2.x).         ==
# ==========================================================================================
# abgui COMPLIES today, and only because of how it is packaged: `abctl.exe` is BUILT in the
# release job and copied next to `abgui.exe` before this package is made, so the engine the
# app spawns is already inside the .msix. Nothing is fetched on first run.
#
# If an "update abctl in place" feature is ever added — a self-updater, a "download the
# matching CLI" button, anything that writes a new executable and then runs it — it MUST be
# hard-disabled when the app is Store-packaged. Disabling the BUTTON is not enough; the
# download itself is the policy violation, so the check has to gate the fetch.
#
# How to detect it: call the Win32 `GetCurrentPackageFullName` (kernel32) over dart:ffi.
# It returns APPMODEL_ERROR_NO_PACKAGE (15700) for the zip / Inno-installer build and
# ERROR_SUCCESS plus a package full name inside the MSIX. There is no Dart or Flutter API
# for this — `Platform` and `package_info_plus` cannot tell the two apart. Treat any
# failure to answer as "packaged" (fail closed): shipping an update path that silently
# turns itself on is how a certification pass becomes a takedown.
#
# Belt and braces, the write would fail anyway — an installed MSIX lives under
# `%ProgramFiles%\WindowsApps`, whose ACLs deny the running user write access — but "the
# OS happened to stop us" is not a compliance argument, and the DOWNLOAD would already
# have happened by then.
msix_config:
  # Overridden in CI by MSIX_DISPLAY_NAME. Left as the app's own name so a local package
  # is recognisable; it is NOT a reserved Store name and will be rejected as one.
  display_name: abgui
  publisher_display_name: "Gigaion, LLC"
  identity_name: PLACEHOLDER.SetMsixIdentityNameVar
  publisher: CN=PLACEHOLDER-SET-MSIX-PUBLISHER-VAR
  # Four parts, and the last MUST be 0 — the Store reserves the revision field. CI passes
  # `--version <x.y.z>.0` derived from the release tag, so this only serves local builds
  # and should track `version:` above.
  msix_version: 0.4.27.0
  # The same 1024x1024 source the AppImage and the macOS icon set come from; msix
  # generates the whole tile/logo family from it.
  logo_path: assets/icon/abgui.png
  # == capabilities: the MINIMUM set, and why nothing else is here ==
  #
  # internetClient — the only one. abgui itself opens no sockets; `abctl.exe` does, and it
  #   runs inside this package, so its traffic is this package's traffic: outbound TLS to
  #   api-business.apple.com (the Apple Business API) and account.apple.com (the token
  #   endpoint that ES256-signs a client assertion into an access token). A full-trust
  #   package is not network-isolated, so omitting this would not *break* the app — it
  #   would be an undisclosed capability, which is a certification finding, not a runtime
  #   one. Declare what the product actually does.
  #
  # NOT internetClientServer — nothing listens. abgui talks to abctl over the child
  #   process's stdout/stderr pipes, not a loopback HTTP server, so there is no inbound
  #   socket to declare. (This is where a port from a GUI that drives a daemon over
  #   127.0.0.1 would differ; ours does not.)
  #
  # NOT privateNetworkClientServer — Apple's endpoints are public internet. Declaring it
  #   would claim LAN/domain reach the app never uses, and certification asks why.
  #
  # NOT broadFileSystemAccess / documentsLibrary — those are for AppContainer apps. This
  #   package's entry point is `Windows.FullTrustApplication`, so the process already runs
  #   on the user's own token and reads/writes the chosen GitOps workspace and
  #   %LOCALAPPDATA%\abgui directly. Adding them buys nothing and adds a second restricted
  #   capability to justify.
  #
  # runFullTrust is DELIBERATELY ABSENT from this list and must stay absent: msix emits
  #   `<rescap:Capability Name="runFullTrust"/>` unconditionally (see msix's
  #   appx_manifest.dart) because every Flutter Win32 app has that entry point. It is what
  #   lets abgui spawn abctl.exe at all, so it cannot be removed — but it IS a restricted
  #   capability, which means every packaged submission must fill Partner Center's
  #   "Restricted capabilities" justification box. Text to paste is in
  #   docs/windows-store-and-signing.md.
  capabilities: internetClient
  # Local builds are test-signed and installable; CI passes `--store` on the command line
  # for the Partner-Center-ready, Microsoft-signed-on-ingestion package.
  store: false

# --- launcher icons -------------------------------------------------------------------
# Regenerate after changing the brand master:
#     cd abgui-flutter && dart run flutter_launcher_icons
# The master itself is generated — see docs/brand/render-icon.py, which emits both the
# SVG and this PNG from one set of constants so they cannot drift.
#
# Linux is absent because flutter_launcher_icons does not support it: the Linux icon is
# assets/icon/abgui.png, copied into the AppImage's AppDir by scripts/build-gui-flutter.sh,
# and the same file is the MSIX logo. Keep all three in step by regenerating from the
# brand master rather than editing any of them by hand.
flutter_launcher_icons:
  image_path: "../docs/brand/abcli-icon-1024.png"
  macos:
    generate: true
    image_path: "../docs/brand/abcli-icon-1024.png"
  windows:
    generate: true
    image_path: "../docs/brand/abcli-icon-1024.png"
    icon_size: 256
