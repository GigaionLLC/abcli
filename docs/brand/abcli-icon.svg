    <clipPath id="tile"><rect width="1024" height="1024" rx="196" ry="196"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#ground)"/>

    <!-- the merge: branches out of the window, into one arrow -->
    <g stroke="#FFB03C" stroke-width="46" stroke-linecap="round" fill="none">
      <path d="M320,624 L512,806"/>
      <path d="M704,624 L512,806"/>
      <path d="M512,792 L512,856"/>
    </g>
    <polygon points="512,952 404,842 620,842" fill="#FFB03C"/>

    <!-- the terminal window -->
    <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Inset by half the stroke. Pillow draws a rectangle outline INSIDE the given box,
           whereas SVG centres a stroke on its path — so emitting the same numbers to both
           renderers would put the SVG's frame half a stroke-width proud on every side. The
           constants are shared; this reconciles the two conventions. -->
      <rect x="150.0" y="188.0"
            width="724" height="416"
            rx="36.0" ry="36.0" stroke-width="40"/>
      <path d="M130,272 H894" stroke-width="30"/>

      <!-- > prompt -->
      <path d="M212,396 L296,462 L212,528"
            stroke-width="44"/>

      <!-- A — apex overshoots slightly so it reads optically level with the B -->
      <path d="M397.8,576 L486,337.0 L574.2,576"
            stroke-width="44"/>
      <path d="M438.4,497.1 H533.6" stroke-width="44"/>

      <!-- B — stem plus two elliptical bowls, the lower slightly wider -->
      <path d="M664,344 V576" stroke-width="44"/>
      <path d="M664,366.0 A105.6,33.1 0 0 1 664,432.2" fill="none" stroke-width="44"/>
      <path d="M664,476.2 A121.8,38.9 0 0 1 664,554.0" fill="none" stroke-width="44"/>
    </g>

    <!-- title-bar dots, in ink: the title bar is a RULE, not a filled bar, so knocking
